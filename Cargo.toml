[package]
name = "hako"
version = "0.1.0"
edition = "2024"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
expect_used = "warn"

[features]
default = ["full"]
full = ["fetch-smol", "embedded-tls"]
full-static = ["fetch-sync", "embedded-tls"]
smol-runtime = ["dep:smol", "dep:futures-lite"]
fetch-sync = []
fetch-smol = ["smol-runtime"]
tls-dynamic = ["dep:native-tls", "dep:async-native-tls"]
rustls = ["dep:rustls", "dep:rustls-native-certs", "dep:futures-rustls"]
embedded-tls = [
  "dep:embedded-tls",
  "dep:embedded-io",
  "dep:embedded-io-async",
  "dep:embedded-io-adapters",
  "dep:rand_core",
  "dep:webpki",
  "dep:rustls-native-certs",
  "dep:digest",
]

[dependencies]
async-native-tls = { version = "0.6", optional = true, default-features = false, features = [
  "runtime-smol",
] }
digest = { version = "0.10", optional = true }
embedded-io-adapters = { version = "0.7", optional = true, default-features = false, features = [
  "std",
  "futures-03",
] }
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }
embedded-tls = { version = "0.18", optional = true, default-features = false, features = [
  "std",
] }
futures-lite = { version = "2.6", optional = true }
futures-rustls = { version = "0.26", optional = true, default-features = false, features = [
  "ring",
] }
md-5 = { version = "0.11" }
native-tls = { version = "0.2", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = [
  "std",
  "ring",
  "tls12",
] }
webpki = { package = "rustls-webpki", version = "0.101", optional = true, default-features = false, features = [
  "alloc",
  "std",
] }
rustls-native-certs = { version = "0.8", optional = true }
sha2 = { version = "0.11" }
smol = { version = "2.0", optional = true }
tar-core = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["net", "hostname", "feature", "poll", "uio"] }
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }

[build-dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage"] }
clap_complete = { version = "4.5", default-features = false }
clap_mangen = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

[patch.crates-io]
embedded-tls = { path = "vendor/embedded-tls" }

[profile.release]
strip = true    # Automatically strip symbols from the binary.
opt-level = "z" # optimize for size
lto = true      # lto
panic = "immediate-abort"
